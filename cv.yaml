# =============================================================================
#  Alexander Mendola – web CV content
#  -------------------------------------------------------------------------
#  Single source of truth for the site. Edit, then `npm run build`.
#
#  Inline markup in prose fields:
#      **bold**              emphasis
#      [label](https://url)  link
#      {{year}}              current year, at build time
#  Everything else is escaped.
# =============================================================================

meta:
  lang: en-GB
  title: Alexander Mendola – Application Developer & Consultant
  description: >-
    Application developer and consultant at IBM in London. Full-stack
    development, DevOps, and keeping business-critical systems running in
    production.
  # author: defaults to hero.name. Set here only to override.

  # Deployed origin. Needed for absolute og: URLs and the canonical link.
  url: https://cv.alexandermendola.dev

  # Link previews (LinkedIn, Slack, iMessage, WhatsApp, Twitter/X).
  # og.title and og.description fall back to meta.title and meta.description.
  og:
    site_name: Alexander Mendola
    # Resolved against meta.url. PNG or JPEG only, 1200x630; LinkedIn
    # ignores SVG.
    image: /og.png
    image_alt: >-
      Alexander Mendola – Application Developer & Consultant, IBM London.

  # Google Fonts families pulled in by the page.
  fonts:
    - IBM+Plex+Mono:ital,wght@0,400;0,500;1,400
    - IBM+Plex+Sans:wght@400;500;600;700

site:
  brand: ~/alexander-mendola
  skip_link: Skip to content # First thing a keyboard user tabs to; hidden until focused.
  nav:
    - { label: about, href: "#about" }
    - { label: experience, href: "#experience" }
    - { label: work, href: "#work" }
    - { label: contact, href: "#contact" }

# -----------------------------------------------------------------------------
# Hero
# -----------------------------------------------------------------------------
hero:
  kicker: application developer & consultant
  name: Alexander Mendola
  cursor: "_"
  role: >-
    I build full-stack solutions to real business problems – and enjoy the
    people side as much as the code.
  lede: >-
    Developer and consultant at IBM in London. I've spent three years building
    software for large organisations, and I now support the live systems a
    client's business runs on.
  actions:
    - { label: See selected work, href: "#work", style: button }
    - { label: Get in touch, href: "#contact", style: quiet }

  # Editor card in the hero. `profile` is re-serialised as highlighted YAML
  # at build time, so the card renders this block verbatim.
  editor:
    tab: profile.yaml
    comment: the short version
    # Keys listed here render as inline [a, b] lists instead of block lists.
    flow_keys: [open_to]
    profile:
      name: Alexander Mendola
      role: Application Developer & Consultant
      firm: IBM
      base: London, UK
      studying: BSc Digital & Technology Solutions
      focus:
        - full-stack development
        - devops & ci/cd
        - cloud
      open_to: [collaboration, interesting problems]

# -----------------------------------------------------------------------------
# About, skills, credentials
# -----------------------------------------------------------------------------
about:
  id: about
  heading: About
  paragraphs:
    - >-
      Most of what I do sits between a business problem and something running
      in production: talking to the people who'll use a thing, turning what
      they need into something buildable, getting it shipped, and then working
      out what's gone wrong when it breaks.
    - >-
      Until mid-2026 that was **a resource management platform used by over
      1,500 employees** – I led it, mentored the people building it, and pushed
      the team's testing and code review standards along the way. Since mid-2026 it
      has been external client work: **live HR systems**, where the job is production
      issues, security and reliability.
    - >-
      Alongside the day job, I'm completing a Digital & Technology Solutions
      degree apprenticeship at Northeastern University London – sharpening the
      theory behind the practice. Before that, I volunteered for three years
      at Chigwell Riding Trust for Special Needs, supporting riders with
      additional needs – something I started for my Duke of Edinburgh Award and
      carried on long after it finished, because I enjoyed it.
  now:
    heading: currently
    items:
      - "**Supporting** live client systems in production"
      - "**Studying** BSc Digital & Technology Solutions, Northeastern University London"
      - "**Leading** learner voice representation for 100+ apprentices"

# accent: amber | teal | violet | muted – colours the group like a token type.
skills:
  - group: languages
    accent: amber
    items: [JavaScript, Python, SQL]
  - group: stack
    accent: teal
    items: [Vue.js, Node.js, PostgreSQL, Sequelize, Jest]
  # Abbreviation first, expansion in brackets, on first use only.
  - group: devops & cloud
    accent: violet
    items: [Docker, Kubernetes, CI/CD, OCI (Oracle Cloud Infrastructure)]
  - group: practices
    accent: muted
    items:
      [
        agile delivery,
        design thinking,
        accessibility,
        UX (user experience),
        QA (quality assurance),
        application support,
        client relations,
      ]

credentials:
  heading: credentials
  # Ordered: earned first, newest first, then in progress.
  # `url` is optional; without one the name renders as plain text.
  items:
    - name: OCI Certified Foundations Associate
      issuer: Oracle
      year: 2026
      url: https://catalog-education.oracle.com/ords/certview/sharebadge?id=C00189E984A490EA0D740EFCC27CDCEAF83D438AB8D74E7DF736E809675225C2
    - name: Enterprise Design Thinking Practitioner
      issuer: IBM
      year: 2025
      url: https://www.credly.com/badges/b7d99ff2-3172-4916-913a-5a4d5bd3b679/
    - name: Generative & Agentic AI Foundation
      issuer: IBM
      year: 2024
      url: https://www.credly.com/badges/b4ac2bb6-2c4f-4294-a836-82f846dbeaca/
    - name: AWS Certified Cloud Practitioner
      issuer: Amazon Web Services
      year: in progress
  # Rendered as a `# comment` line under the list.
  note: full list on [LinkedIn](https://www.linkedin.com/in/alexander-mendola)

# -----------------------------------------------------------------------------
# Experience – rendered as a commit-history style timeline
# -----------------------------------------------------------------------------
experience:
  id: experience
  heading: Experience
  entries:
    - period: 2026 – present
      title: DevOps Engineer & Consultant
      org: IBM, London
      current: true # filled-in timeline dot
      points:
        - >-
          Support business-critical HR applications in a live client
          environment, diagnosing and resolving production issues within agreed
          response and resolution targets.
        - >-
          Improve application reliability and security through vulnerability
          remediation and technical investigation, working alongside
          development and support teams.

    - period: 2023 – 2026
      title: Full-Stack Developer & Consultant · Technical Delivery Lead
      org: IBM, London
      points:
        - >-
          Led technical development and delivery of a resource management
          platform used by 1,500+ employees – **cutting the time to onboard or
          offboard a resource by 88%** against the previous process.
        - >-
          Took on wider technical and delivery ownership: mentoring colleagues,
          facilitating sprints and owning the backlog.
        - >-
          Introduced Jest testing and supported the team in adopting it,
          refactored components to clear technical debt and improved the CI/CD
          pipeline.

    # Concurrent with the apprenticeship. No `current` flag, so the filled
    # timeline dot stays on the primary role.
    - period: 2023 – present
      title: Learner Voice and Student Representative
      org: Northeastern University London
      points:
        - >-
          Represent the degree apprenticeship community at Northeastern, and
          lead the representatives for IBM's 100+ apprentices – voluntary,
          alongside the apprenticeship.
        - >-
          Take apprentice feedback into university governance, including the
          Work-Related Learning Management Board and the inaugural Centre for
          Apprenticeships Academic Director meeting.
        - >-
          Advocacy that has contributed to clearer End-Point Assessment
          guidance, better-coordinated assessment scheduling, and a dedicated
          apprentice role in the Students' Union.

    - period: 2023 – 2027 (expected)
      title: BSc Digital & Technology Solutions (Degree Apprenticeship)
      org: Northeastern University London
      points:
        - >-
          Full-time client delivery alongside formal study of software
          engineering and how technology gets adopted inside an organisation.

    - period: 2020 – 2022
      title: "A-levels: Computer Science, Economics, Mathematics"

# -----------------------------------------------------------------------------
# Selected work
# -----------------------------------------------------------------------------
work:
  id: work
  heading: Selected work
  items:
    - title: Business-critical application support
      featured: true
      badge: client delivery
      year: 2026 – present
      tech: production support · incident response · security
      body:
        - >-
          The HR systems a large client runs its people operations on – the
          kind where an outage is felt the same day. Problems rarely arrive
          with a cause attached, so most of the job is working out what
          actually happened before deciding what to change so it cannot happen
          twice.

    - title: Resource management platform
      featured: true
      badge: platform
      year: 2023 – 2026
      tech: Vue.js · Node.js · PostgreSQL
      body:
        - >-
          Replaced slower, manual resourcing processes across a large
          organisation with a single system people actually want to use. I led
          it across the stack, from the Vue.js front end through to
          containerised deployment.
      outcome: >-
        Cut the time to onboard or offboard a resource by 88% against the
        previous process. In daily use by 1,500+ employees.

    - title: This site
      year: 2026
      tech: Node.js · YAML · no framework
      body:
        - >-
          The page you're reading. A single YAML file holds every piece of
          content; a small Node script renders it to static HTML, CSS and JS
          with one dependency and no framework. The editor panel in the hero
          and the card you get when the link is shared are both generated from
          that same file, so neither can drift from the config behind it.
      outcome: >-
        Meets WCAG (Web Content Accessibility Guidelines) AA contrast on every
        colour pair, keyboard navigable throughout, and honours the reader's
        reduced-motion preference.

  # Applies to the client projects above, not to this site.
  note: >-
    client work above is described in general terms under confidentiality –
    happy to go into specifics where possible in conversation.

# -----------------------------------------------------------------------------
