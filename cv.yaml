          Support business-critical HR applications in a live client
          environment, diagnosing and resolving production issues within agreed
          response and resolution targets.
        - >-
          Improve application reliability and security through vulnerability
          remediation and technical investigation, working alongside
          development and support teams.

    - period: 2023 – 2026
      title: Full-Stack Developer & Consultant · Technical Delivery Lead
