# =============================================================================
#  Alexander Mendola – web CV content
#  -------------------------------------------------------------------------
#  This file is the single source of truth for the site. Edit it, then run:
#      npm run build
#  ...and dist/ is regenerated. You should never need to touch the HTML.
#
#  Prose fields accept a tiny bit of inline markup:
#      **bold**                  -> emphasised text
#      [label](https://url)      -> a link
#  Everything else is escaped, so ampersands and angle brackets are safe.
# =============================================================================

meta:
  lang: en-GB
  title: Alexander Mendola – Application Developer & Consultant
  description: >-
    Application developer and consultant at IBM in London, specialising in
    full-stack development, DevOps and delivering technology that solves real
    business challenges.
  # <meta name="author"> falls back to hero.name, so it is only worth setting
  # here if the two should differ:
  #   author: Alexander Mendola

  # Where the site is deployed. Open Graph requires absolute URLs, and a page
  # cannot know its own address, so this has to be stated. Also used for the
  # canonical link.
  url: https://cv.alexandermendola.dev

  # Link previews (LinkedIn, Slack, iMessage, WhatsApp, Twitter/X).
  # og.title and og.description fall back to meta.title and meta.description.
  og:
    site_name: Alexander Mendola
    # Relative to meta.url above. Must be a real PNG or JPEG – SVG is not
    # supported by LinkedIn. 1200x630 is the standard size.
    image: /og.png
    image_alt: >-
      Alexander Mendola – Application Developer & Consultant, IBM London.

  # Google Fonts families pulled in by the page.
  fonts:
    - IBM+Plex+Mono:ital,wght@0,400;0,500;1,400
    - IBM+Plex+Sans:wght@400;500;600;700

site:
  brand: ~/alexander-mendola
  skip_link: Skip to content # First thing a keyboard user tabs to; hidden until focused.
  nav:
    - { label: about, href: "#about" }
    - { label: experience, href: "#experience" }
    - { label: work, href: "#work" }
    - { label: contact, href: "#contact" }

# -----------------------------------------------------------------------------
# Hero
# -----------------------------------------------------------------------------
hero:
  kicker: application developer & consultant
  name: Alexander Mendola
  cursor: "_"
  role: >-
    I build full-stack solutions to real business problems – and enjoy the
    people side as much as the code.
  lede: >-
    Developer and consultant at IBM in London, working across the full software
    lifecycle: translating business requirements into technical solutions, then
    building, shipping and supporting them in live environments.
  actions:
    - { label: See selected work, href: "#work", style: button }
    - { label: Get in touch, href: "#contact", style: quiet }

  # The code-editor card. `profile` below is re-serialised as syntax-highlighted
  # YAML at build time – so what the card shows really is this config.
  editor:
    tab: profile.yaml
    comment: the short version
    # Keys listed here render as inline [a, b] lists instead of block lists.
    flow_keys: [open_to]
    profile:
      name: Alexander Mendola
      role: Application Developer & Consultant
      firm: IBM
      base: London, UK
      studying: BSc Digital & Technology Solutions
      focus:
        - full-stack development
        - devops & ci/cd
        - cloud
      open_to: [collaboration, interesting problems]

# -----------------------------------------------------------------------------
# About, skills, credentials
# -----------------------------------------------------------------------------
about:
  id: about
  heading: About
  paragraphs:
    - >-
      I'm an application developer and consultant at **IBM**, specialising in
      full-stack development, DevOps and delivering technology that solves real
      business challenges. My experience spans the whole software lifecycle –
      from translating requirements into technical solutions to developing,
      deploying and supporting applications in live environments.
    - >-
      Right now, that means **leading the technical development and delivery of
      a resource management platform** used by over 1,500 employees – owning
      development activities, mentoring colleagues, and driving improvements in
      code quality, testing and delivery practices along the way.
    - >-
      Alongside the day job, I'm completing a Digital & Technology Solutions
      degree apprenticeship at Northeastern University London – sharpening the
      theory behind the practice. Before all this, I spent a couple of years
      volunteering at a riding stables supporting people with special needs.
  now:
    heading: currently
    items:
      - "**Leading** delivery of a resource management platform (1,500+ users)"
      - "**Studying** BSc Digital & Technology Solutions, Northeastern University London"
      - "**Mentoring** colleagues on code quality & testing practices"

# accent: amber | teal | violet | muted – colours the group like a token type.
skills:
  - group: languages
    accent: amber
    items: [JavaScript, Python, SQL]
  - group: stack
    accent: teal
    items: [Vue.js, Node.js, PostgreSQL]
  - group: devops & cloud
    accent: violet
    items: [Docker, Kubernetes, CI/CD, Hybrid Cloud, OCI]
  - group: practices
    accent: muted
    items:
      [agile delivery, design thinking, accessibility, UX, QA, client relations]

credentials:
  heading: credentials
  # Four only: earned ones first, newest first, then anything in progress. The
  # "Essentials"/"Fundamentals" badges are deliberately left off – they read as
  # introductory next to these and dilute the list. The rest live on LinkedIn.
  items:
    - { name: OCI Certified Foundations Associate, issuer: Oracle, year: 2026 }
    - { name: Enterprise Design Thinking Practitioner, issuer: IBM, year: 2025 }
    - { name: Generative & Agentic AI Foundation, issuer: IBM, year: 2024 }
    - {
        name: AWS Certified Cloud Practitioner,
        issuer: Amazon Web Services,
        year: in progress,
      }
  # Rendered as a `# comment` line under the list.
  note: full list on [LinkedIn](https://www.linkedin.com/in/alexander-mendola)

# -----------------------------------------------------------------------------
# Experience – rendered as a commit-history style timeline
# -----------------------------------------------------------------------------
experience:
  id: experience
  heading: Experience
  entries:
    - period: 2023 – present
      title: Application Developer & Consultant
      org: IBM, London
      current: true # filled-in timeline dot
      points:
        - >-
          Lead the technical development and delivery of a resource management
          platform supporting 1,500+ employees – improving operational
          efficiency and streamlining business processes.
        - >-
          Own development activities across the team: mentoring colleagues and
          raising standards for code quality, testing and delivery.
        - >-
          Support business-critical applications in live environments,
          resolving production issues and improving system reliability and
          security.

    - period: 2023 – 2027 (expected)
      title: BSc Digital & Technology Solutions – Degree Apprenticeship
      org: Northeastern University London
      points:
        - >-
          Full-time client delivery alongside formal study of software
          engineering and how technology drives business change.

    - period: 2020 – 2022
      title: "A-levels: Computer Science, Economics, Mathematics"
      org: Sixth form

# -----------------------------------------------------------------------------
# Selected work
# -----------------------------------------------------------------------------
work:
  id: work
  heading: Selected work
  items:
    - title: Resource management platform
      featured: true
      badge: featured
      year: ongoing
      tech: Vue.js · Node.js · PostgreSQL
      body:
        - >-
          Replaces slower, manual resourcing processes across a large
          organisation with a single system people actually want to use. I lead
          technical development and delivery.
      outcome: >-
        In daily use by 1,500+ employees; streamlined operations and business
        processes across the organisation.

    - title: Business-critical application support
      year: ongoing
      tech: production support · security
      body:
        - >-
          Live systems the business depends on every day. I diagnose and
          resolve production issues, tighten security, and lift reliability.

    - title: Engineering practice uplift
      year: ongoing
      tech: code quality · testing · CI/CD
      body:
        - >-
          Better ways of working across the team – stronger code review, more
          meaningful test coverage and smoother delivery pipelines – with
          mentoring alongside.

    - title: This site
      year: 2026
      tech: Node.js · YAML · no framework
      body:
        - >-
          The page you're reading. A single YAML file holds every piece of
          content; a small Node script renders it to static HTML, CSS and JS
          with one dependency and no framework. The editor panel in the hero
          and the card you get when the link is shared are both generated from
          that same file, so neither can drift from the config behind it.
      outcome: >-
        Meets WCAG AA contrast on every colour pair, keyboard navigable
        throughout, and honours prefers-reduced-motion.

  # Scoped to the client work above – this site is the one thing here a reader
  # can actually inspect.
  note: >-
    client work above is described in general terms under confidentiality –
    happy to go into specifics in conversation.

# -----------------------------------------------------------------------------
# Contact & footer
# -----------------------------------------------------------------------------
contact:
  id: contact
  heading: Contact
  intro: >-
    The fastest way to reach me is email – happy to talk projects, consulting,
    or anything full-stack and DevOps.
  links:
    - {
        label: alexander.mendola@outlook.com,
        href: "mailto:alexander.mendola@outlook.com",
      }
    - {
        label: linkedin.com/in/alexander-mendola,
        href: "https://www.linkedin.com/in/alexander-mendola",
      }

footer:
  # {{year}} is filled in at build time – Cloudflare rebuilds on every push,
  # so this stays current without being edited.
  left: "© {{year}} Alexander Mendola"
  right: hand-written HTML, built from one YAML file. no framework, no tracker.
