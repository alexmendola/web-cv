  intro: >-
    Email is best. Happy to talk about work, the apprenticeship route, or whatever you're currently trying to keep running in production.
  links:
    - {
        label: alexander.mendola@outlook.com,
        href: "mailto:alexander.mendola@outlook.com",
      }
    - {
        label: linkedin.com/in/alexander-mendola,
        href: "https://www.linkedin.com/in/alexander-mendola",
      }
    - { label: github.com/alexmendola, href: "https://github.com/alexmendola" }

footer:
  # {{year}} resolves at build time.
  left: "© {{year}} Alexander Mendola"
  right: built from one YAML file. no framework, no tracker.
